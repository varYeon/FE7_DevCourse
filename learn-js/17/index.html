<input type="password" id="passwordInput">
<input type="checkbox" id="showPassword"> 비밀번호 보기
<script>
  const show = document.querySelector("#showPassword");
  show.addEventListener("click", function(){
    // 패스워드의 타입 속성을 변경해야 함
    show.setAttribute("type", "text");
  });

</script>
